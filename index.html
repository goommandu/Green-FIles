<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN FILE 녹색의 증언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 상태바 + 장면 영역 + 하단 대화창. 조사 모드는 3열(장소/자료/수첩), 청문회는 증인석/증언/조사관석 */
:root{
  --bg:#0b111b;
  --panel:#131c29;
  --panel2:#1a2636;
  --line:#2a3a4f;
  --ink:#e4ebe8;
  --muted:#8796a5;
  --teal:#38c3a6;
  --teal-dim:#16443c;
  --paper:#dcdfd8;
  --paper-ink:#1b232c;
  --warn:#f0893a;
  --red:#e5484d;
  --gold:#d6b26a;
  --display:"Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0e1622;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;letter-spacing:.06em;font-size:15px}
.brand b{color:var(--teal)}
.chap{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.stat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.stat strong{color:var(--ink);font-family:var(--mono);font-size:14px}
.meter{width:110px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--teal);transition:width .4s}
.meter.low span{background:var(--red)}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-size:13px;font-weight:600}
.tbtn:hover{border-color:var(--teal)}
.tbtn .n{font-family:var(--mono);color:var(--teal);margin-left:4px}
main{overflow:auto;position:relative}
.scene{max-width:1180px;margin:0 auto;padding:18px;min-height:100%}

/* 타이틀 */
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:760px;margin:0 auto;padding:40px 20px}
.title .file{font-family:var(--mono);color:var(--teal);font-size:13px;letter-spacing:.2em}
.title h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,76px);line-height:1.05;margin:0}
.title h1 small{display:block;font-size:.42em;color:var(--muted);font-weight:700;margin-top:10px;letter-spacing:.02em}
.title blockquote{margin:0;border-left:3px solid var(--teal);padding-left:16px;font-family:var(--display);font-size:19px;line-height:1.7}
.title p{color:var(--muted);max-width:60ch;margin:0}
.primary{background:var(--teal);color:#06231d;border:none;border-radius:8px;padding:12px 22px;font-weight:700;font-size:16px;width:max-content}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{opacity:.4;cursor:default;filter:none}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600}
.ghost:hover{border-color:var(--teal)}

/* 조사 모드 */
.inv{display:grid;grid-template-columns:210px 1fr 300px;gap:16px;align-items:start}
@media (max-width:980px){.inv{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px}
.h{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.loc{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.loc small{color:var(--muted);font-size:12px}
.loc.on{border-color:var(--teal);background:var(--teal-dim)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.doc{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.35);min-height:150px}
.doc .ty{font-size:11px;font-weight:700;letter-spacing:.08em;color:#4c5966}
.doc h4{margin:0;font-size:15px;line-height:1.4}
.doc p{margin:0;font-size:13px;color:#3d4955}
.doc .act{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc .cost{font-family:var(--mono);font-size:12px;color:#4c5966}
.doc button{background:var(--paper-ink);color:var(--paper);border:none;border-radius:5px;padding:6px 12px;font-size:13px;font-weight:700}
.doc button:disabled{opacity:.35;cursor:default}
.doc.got{opacity:.62}
.doc.got::after{content:"확보";position:absolute;top:10px;right:10px;font-family:var(--display);font-weight:900;color:#1d6b58;border:2px solid #1d6b58;border-radius:4px;padding:0 6px;transform:rotate(8deg);font-size:13px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px;font-size:12.5px;font-weight:600}
.tabs button.on{border-color:var(--teal);color:var(--teal)}
.sus{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sus:last-child{border-bottom:none}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;width:max-content}
.pill.none{background:#2b2f36;color:var(--muted)}
.pill.some{background:#3d2b17;color:var(--warn)}
.pill.done{background:var(--teal-dim);color:var(--teal)}
.tl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.tl div{display:grid;grid-template-columns:78px 1fr;gap:6px}
.tl span:first-child{font-family:var(--mono);color:var(--muted);font-size:12px}
.tl .hot span:last-child{color:var(--warn)}
.say{font-size:13px;border-left:2px solid var(--line);padding-left:8px}
.say b{display:block;font-size:12px;color:var(--muted)}
.brief{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.brief p{margin:0;font-size:14px}

/* 포트레이트 */
.por{flex:none}
.por svg{display:block}

/* 대화창 */
.dlg{border-top:1px solid var(--line);background:#0e1622;min-height:0}
.dlg-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:flex-start}
.dlg .who{font-weight:700;font-size:13px}
.dlg .who small{color:var(--muted);font-weight:500;margin-left:6px}
.dlg .txt{font-size:16px;line-height:1.65;max-width:75ch}
.dlg .txt.narr{color:var(--muted);font-style:italic}
.dlg .body{flex:1;display:flex;flex-direction:column;gap:4px}
.dlg .nx{align-self:flex-end;background:var(--teal);color:#06231d;border:none;border-radius:6px;padding:8px 16px;font-weight:700}
.dlg.hidden{display:none}

/* 청문회 */
.hear{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.hear{grid-template-columns:1fr}}
.stand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.stand .nm{font-weight:700}
.stand .rl{font-size:12px;color:var(--muted)}
.claims{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:6px}
.claim{display:flex;justify-content:space-between;gap:6px;font-size:12px;text-align:left;border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.claim .sh{font-family:var(--mono);color:var(--warn)}
.claim.broken{border-color:var(--teal);color:var(--teal);text-decoration:line-through}
.testi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.testi h3{margin:0;font-family:var(--display);font-size:20px}
.testi .sub{font-size:13px;color:var(--muted);margin:0}
.stmt{font-family:var(--display);font-size:clamp(17px,2.2vw,21px);line-height:1.75;display:flex;gap:10px}
.stmt .no{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:5px;min-width:22px}
.ph{border:none;background:none;padding:0 2px;font:inherit;color:var(--ink);border-bottom:2px dashed var(--teal);cursor:pointer;line-height:inherit;text-align:left}
.ph:hover{background:var(--teal-dim)}
.ph.sel{background:var(--teal);color:#06231d;border-bottom-color:transparent;border-radius:3px}
.ph.dead{border-bottom:2px solid var(--teal);color:var(--muted);text-decoration:line-through;cursor:default}
.ph.shield{border-bottom-color:var(--warn)}
.def{font-size:14px;color:var(--warn);border-left:3px solid var(--warn);padding:4px 10px;background:rgba(240,137,58,.08)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.bar .hint{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.act-btn{border:2px solid var(--teal);background:transparent;color:var(--teal);border-radius:8px;padding:9px 16px;font-weight:700}
.act-btn:hover:not(:disabled){background:var(--teal);color:#06231d}
.act-btn.q{border-color:var(--gold);color:var(--gold)}
.act-btn.q:hover:not(:disabled){background:var(--gold);color:#241b06}
.act-btn:disabled{opacity:.35;cursor:default}

/* 모달(증거 파일 / 질문) */
.modal{position:fixed;inset:0;background:rgba(4,8,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(980px,100%);max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:16px;flex:1}
.sheet .x{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.ev{display:grid;grid-template-columns:270px 1fr;min-height:0;flex:1}
@media (max-width:720px){.ev{grid-template-columns:1fr}}
.evlist{overflow:auto;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;max-height:70vh}
.evi{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.evi.on{border-color:var(--teal)}
.evi small{color:var(--muted);font-size:11.5px}
.evi .t{font-size:13.5px;font-weight:600;line-height:1.35}
.evd{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:70vh}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:16px;font-size:14.5px;line-height:1.7}
.paper .ty{font-size:11px;font-weight:700;letter-spacing:.08em;color:#4c5966}
.paper h4{margin:4px 0 8px;font-size:17px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12.5px}
@media (max-width:720px){.meta{grid-template-columns:1fr 1fr}}
.meta div{background:var(--panel2);border-radius:6px;padding:6px 8px}
.meta b{display:block;color:var(--muted);font-weight:600;font-size:11px}
.lim{border:1px dashed var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.lim .k{font-size:12px;color:var(--warn);font-weight:700}
.fact{border:1px solid var(--teal-dim);background:rgba(56,195,166,.06);border-radius:8px;padding:10px 12px;font-size:14px}
.fact .k{font-size:12px;color:var(--teal);font-weight:700;display:block}
.evd .go{display:flex;gap:8px;flex-wrap:wrap}
.qlist{padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.qbtn{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px}
.qbtn:hover:not(:disabled){border-color:var(--gold)}
.qbtn:disabled{opacity:.4;cursor:default}

/* 포렌식 */
.foren{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media (max-width:900px){.foren{grid-template-columns:1fr}}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chart svg{width:100%;height:auto;display:block}
.readout{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.readout .big{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.step.cur{border-color:var(--teal)}
.step.ok{opacity:.6}
.step .k{font-size:12px;color:var(--muted);font-weight:700}
.step input{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 10px;font-family:var(--mono);font-size:15px;width:90px}
.tries{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:inline-block}
.tries i.x{background:var(--red)}
.foot{font-size:12.5px;color:var(--muted)}
.dtable{font-size:12.5px;border-collapse:collapse;width:100%;font-family:var(--mono)}
.dtable td,.dtable th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
.dtable th{color:var(--muted);font-weight:500}

/* 라운드 4/5 */
.round{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.round h3{margin:0;font-family:var(--display);font-size:20px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.6;display:flex;gap:10px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{opacity:.4;cursor:default}
.opt .l{font-family:var(--mono);color:var(--teal);font-weight:600}
.opt.lock{border-style:dashed}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.slots{grid-template-columns:1fr}}
.slot{display:flex;flex-direction:column;gap:6px}
.slot .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.slot .opt{font-size:13.5px;padding:9px 10px}
.slot .opt.on{border-color:var(--teal);background:var(--teal-dim)}
.slot .opt.badpick{border-color:var(--red)}

/* 결과 */
.res{display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.grades{grid-template-columns:1fr 1fr}}
.grade{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.grade .g{font-family:var(--display);font-size:34px;font-weight:900;color:var(--teal);line-height:1.1}
.grade .g.c{color:var(--warn)}
.grade small{color:var(--muted);font-size:12px}
.grade .lb{font-weight:700;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:16px}
.card p{margin:0;max-width:70ch}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ending{border-left:4px solid var(--teal)}
.ending.bad{border-left-color:var(--warn)}
.ending .k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
.ending h2{margin:0;font-family:var(--display);font-size:26px}

/* 연출 */
.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
.stamp div{font-family:var(--display);font-weight:900;font-size:clamp(46px,10vw,110px);border:6px solid currentColor;padding:4px 30px;transform:rotate(-6deg);background:rgba(11,17,27,.85);animation:st .9s ease-out forwards}
.stamp.good div{color:var(--teal)}
.stamp.bad div{color:var(--red)}
.stamp.soft div{color:var(--warn);font-size:clamp(34px,7vw,70px)}
@keyframes st{0%{transform:rotate(-6deg) scale(1.8);opacity:0}25%{transform:rotate(-6deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion: reduce){.stamp div,.shake{animation:none!important}.stamp div{opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <main id="main"><div class="scene" id="scene"></div></main>
  <div class="dlg hidden" id="dlg" aria-live="polite"></div>
</div>
<div id="modal"></div>
<div id="fx"></div>

<script>
/* =========================================================
   DATA — 증거, 증언, 판정표 (이후 챕터는 이 구조로 확장)
   ========================================================= */
const CH = {
  han:{name:"한서윤", role:"특별감사팀 책임자", c:"#38c3a6", hair:"bob"},
  kang:{name:"강도윤", role:"태림그룹 지속가능경영본부장", c:"#6f97cf", hair:"side"},
  yoon:{name:"윤하진", role:"태림그룹 환경데이터분석 책임자", c:"#c9a96e", hair:"long", glasses:true},
  chair:{name:"오경민", role:"특별청문회 위원장", c:"#9aa5ad", hair:"grey"},
  me:{name:"조사관(나)", role:"특별감사팀", c:"#e4ebe8"},
  nar:{name:"", role:""}
};

const EV = {
  E1:{title:"2025 지속가능경영보고서 p.12", type:"문서", src:"태림그룹 지속가능경영보고서", date:"2026.06 발간", author:"태림그룹 지속가능경영본부", rel:"높음",
      quote:"“해온 산업단지의 직접 배출량(Scope 1) 및 구매 전력에 따른 간접 배출량(Scope 2)은 기준연도(2022년) 대비 40% 감소했다.”",
      fact:"해온 산업단지 한 곳의 Scope 1·2 배출량이 2022년 대비 40% 줄었다고 보고했다.",
      limit:"그룹 전체 배출량은 다루지 않는다. 기준연도를 왜 2022년으로 정했는지도 적혀 있지 않다."},
  E2:{title:"한결인증원 검증의견서", type:"문서", src:"외부 검증기관 한결인증원", date:"2026.05", author:"한결인증원 검증팀", rel:"높음",

let AC=null, muted=false;
function tone(freqs, dur=.18, type="sine", gain=.08){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.05); g.gain.linearRampToValueAtTime(gain,t+i*.05+.02); g.gain.exponentialRampToValueAtTime(.0001,t+i*.05+dur);
      o.connect(g); g.connect(AC.destination); o.start(t+i*.05); o.stop(t+i*.05+dur+.05);
    });
  }catch(e){}
}
const SFX = {
  page:()=>tone([620],.08,"triangle",.04),
  present:()=>tone([98,147],.35,"square",.06),
  hit:()=>tone([392,523,784],.45,"triangle",.09),
  bad:()=>tone([180,170],.5,"sawtooth",.05),
  soft:()=>tone([300,280],.25,"triangle",.05)
};

function nextLine(){
  const dlg=document.getElementById('dlg');
  if(!Q.length){ busy=false; dlg.classList.add('hidden'); dlg.innerHTML=""; render(); return; }

  const it=Q.shift();

      <span class="foot" style="text-align:left">■ 하나당 필요한 증거 강도. 직접 모순 ■■■ · 범위 과장 ■■ · 의문 제기 ■</span></div>

function findPh(id){ for(const T of Object.values(TESTI)) for(const ln of T.lines) for(const p of ln) if(typeof p==="object"&&p.id===id) return p; }
function judge(ph, ev){
  const tbl=JUDGE[ph]||{};
  if(tbl[ev]) return tbl[ev];
  if(tbl._all) return tbl._all;
  return ["irrelevant",GUARD[ph],`이 자료는 ‘${findPh(ph).t}’라는 구절과 직접 관련이 없다. 무엇을 반박하려는지 증인에게 공격할 틈을 줬다.`,"그 자료가 지금 제 진술과 무슨 관계가 있습니까?","smile"];
}
function present(evId){
  closeModal();
  const ph=S.sel; const [g,claim,why,line,expr]=judge(ph,evId);
  S.st.pres++; SFX.present();
  const items=[["me",`<b>지적합니다.</b> ‘${findPh(ph).t}’ — 이 자료를 보십시오. <span style="color:var(--muted)">[${EV[evId].title}]</span>`]];
  if(g in STR){
    if(S.br[claim]){ items.push(["han","그 쟁점은 이미 무너뜨렸어. 다른 구절을 보자.","calm"]); say(items); return; }
    const need=2+S.sh[claim], str=STR[g];
    if(str>=need){
      S.st.good++; S.br[claim]=true; S.kexpr=expr;
      if(!S.st.firstBreak) S.st.firstBreak=claim;
      S.st.route.push(claim);
      items.push(()=>{stamp(g==="direct"?"모순 발견":"범위 과장","good");SFX.hit();});
      items.push(["kang",line,expr]);
      items.push(["han",`<b>${GLABEL[g]}.</b> ${why}`,"calm"]);
      items.push(...afterBreak(claim));
      S.sel=null; say(items); return;
    }
    S.st.weak++; S.cred=Math.max(10,S.cred-5);
    items.push(()=>{stamp(str<2?"의문 제기":"방어됨","soft");SFX.soft();});
    items.push(["kang",line,"calm"]);
    if(str<2) items.push(["han",`<b>${GLABEL[g]}.</b> ${why}`,"calm"]);
    else items.push(["han",`방향은 맞아. 그런데 증인이 이 쟁점의 방어 논리를 이미 굳혔어. 지금은 범위 과장 정도로는 못 뚫어. 추가 질문으로 흔들거나, 더 직접적인 증거가 필요해.`,"calm"]);
    items.push(lowCred);
    say(items); return;
  }
  // 오답: 증인의 반격, 방어 강화
  S.st.bad++;
  const pen = g==="misfire"?20:15; S.cred=Math.max(10,S.cred-pen);
  const target=claim||GUARD[ph]; const before=S.sh[target];
  S.sh[target]=Math.min(2,S.sh[target]+1);
  S.kexpr=expr;
  items.push(()=>{stamp("반격","bad");SFX.bad();});
  items.push(["kang",line,expr]);
  if(S.sh[target]>before){ S.defl[S.stage].push(DEFLINE[target]); items.push(["kang",DEFLINE[target].replace(/[“”]/g,""),"smile"]); }
  items.push(["han",`<b>${GLABEL[g]}.</b> ${why} ${S.sh[target]>before?"증인이 ‘"+CLAIMS[target].t+"’ 쟁점의 방어를 굳혔어. 추가 질문으로 흔들면 다시 기회가 생길 거야.":""}`,"pressed"]);
  items.push(lowCred);
  S.sel=null; say(items);
}
function lowCred(){
  if(S.cred<=35 && !S.warned){
    S.warned=true;
    Q.unshift(["chair","조사관, 근거가 분명한 지적만 해 주십시오. 위원회의 시간이 무한하지 않습니다.","calm"],["han","침착해. 증인의 문장이 사실인지가 아니라, 그 문장이 ‘어디까지’를 말하는지 봐.","calm"]);
  }
}
function afterBreak(claim){
  const out=[];
  if(claim==="C1") out.push(["kang","…정정하겠습니다. 40%는 해온 산업단지 기준입니다. 그룹 전체를 말씀드린 것은 표현상의 문제였습니다.","pressed"]);
  if(claim==="C2") out.push(["han","재설정 자체는 허용돼. 하지만 허용되는 건 사업 구조가 바뀌었을 때야. 2022년은 일시적인 급증이었어. 감축 폭을 크게 보이게 하는 해를 고른 거지.","calm"]);
  if(claim==="C3") out.push(["han","검증은 진짜야. 다만 증인이 말한 ‘이 수치’, 그러니까 그룹 전체 40%를 검증한 게 아니었을 뿐이지.","calm"]);
  if(S.stage==="T1" && (S.br.C1||S.br.C2) && S.br.C3){
    if(!S.br.C1 && S.br.C2) out.push(["han","‘그룹 전체’ 문제는 남아 있지만, 기준연도로 40%의 의미 자체를 흔들었어. 증언 1은 충분해.","calm"]);
    if(S.br.C1 && !S.br.C2 && S.e4!=="analyzed") out.push(["han","기준연도 쪽은 데이터 분석이 없어서 못 건드렸어. 대신 범위 문제로 우회했지. 충분히 유효한 길이야.","calm"]);
    out.push(()=>{S.stage="T2"; S.sel=null; S.kexpr="evasive";});
    out.push(["chair","증인, 재생에너지 사용에 대해서도 진술해 주십시오.","calm"]);
    out.push(["kang","탄소 수치에 대해서는 정정하겠습니다. 그러나 재생에너지 부분은 명확합니다.","evasive"]);
  }
  if(S.stage==="T2" && claim==="C4"){
    out.push(["han","인증서 구매가 불법은 아니야. 문제는 ‘재생에너지로 가동된다’는 말이 실제 공급 방식처럼 들린다는 거지.","calm"]);
    out.push(()=>{S.scene="r4";});
    out.push(["kang","보고서에 공개된 수치는 모두 검증받은 사실입니다. 조사관께서는 지금 검증된 사실을 부정하고 계십니다.","angry"]);
    out.push(["chair","조사관, 증인의 마지막 진술에 대해 질의하십시오.","calm"]);
  }
  return out;
}
function askQ(id){
  closeModal();
  const q=QS.find(x=>x.id===id); S.qLeft--; S.asked.push(id);
  const items=[["me",q.t]];
  q.a.forEach(a=>items.push(a));
  if(q.useful){
    S.st.gq++;
    if(q.claim && S.sh[q.claim]>0){ S.sh[q.claim]=0; S.defl[S.stage]=S.defl[S.stage].filter(d=>d!==DEFLINE[q.claim]); items.push(()=>stamp("방어 약화","soft")); items.push(["han",`‘${CLAIMS[q.claim].t}’ 쟁점의 방어가 풀렸어. 다시 증거를 제시할 수 있어.`,"calm"]); }
    if(q.give && !has(q.give) && !has(q.skipIf)){ S.ev.push(q.give); items.push(["han",`증인의 답변을 증거 파일에 기록했어. <b>[${EV[q.give].title}]</b>`,"calm"]); }
  } else {

/* ---------- 결과 ---------- */
function letter(x){ return x>=.9?"S":x>=.75?"A":x>=.55?"B":"C"; }
function vResult(){
  const st=S.st;
  const fit = st.pres? st.good/st.pres : 0;
  const logic = Math.max(0, 1 - st.r4w*.2 - st.r5w*.15 - (st.r4==="D"?-.1:0));
  const ownedReal=S.ev.length; const rv=S.reviewed.filter(id=>has(id)).length/ownedReal;
  const prec = Math.max(0,(st.concl==="w"?1:st.concl==="x"?.85:st.concl==="z"?.35:.2) - st.bad*.05 + rv*.15);
  const strat = Math.max(0,Math.min(1,.45 + st.gq*.2 - st.bq*.2));
  const G=[["증거 적합성",fit,`제시 ${st.pres}회 중 적중 ${st.good}회`],["논리적 타당성",Math.min(1,logic),`재반박 오답 ${st.r4w} · 논리 구성 오답 ${st.r5w}`],["판단의 정밀성",Math.min(1,prec),`증거 한계 검토 ${S.reviewed.filter(id=>has(id)).length}/${ownedReal}건`],["심문 전략",strat,`유효 질문 ${st.gq} · 부적절 질문 ${st.bq}`]];
  const end = {
    "A+":{k:"ENDING 예고 · A",h:"책임 있는 전환",bad:false,p:"위원회는 그룹 전체 40%라는 표현에 근거가 없고, 산단 수치도 기준연도 선택 때문에 실제보다 크게 보였다고 기록했다. 산단의 감축이 실재한다는 점도 함께 남겼다. 과장을 지적하되 성과를 지우지 않은 판단이다."},
    "A":{k:"ENDING 예고 · A",h:"책임 있는 전환",bad:false,p:"위원회는 검증된 산단 수치와 그룹 전체를 내세운 홍보를 구분해 기록했다. 기업은 홍보 문구를 정정하겠다고 밝혔다. 다만 40%라는 숫자가 어떤 기준에서 나왔는지는 아직 아무도 묻지 않았다."},
    "B":{k:"ENDING 예고 · B",h:"완벽한 희생양의 그림자",bad:true,p:"‘모든 성과가 거짓’이라는 결론은 기사 제목으로는 강렬했다. 하지만 기업은 산단의 실제 감축 자료를 내밀며 반박했고, 위원회 기록에는 조사관의 과잉 결론이 남았다. 사람들은 누군가를 탓할 준비가 됐지만, 구조를 바꿀 준비는 되지 않았다."},
    "C":{k:"ENDING 예고 · C",h:"녹색 면죄부",bad:true,p:"위원회는 ‘검증받은 수치’라는 말에 안도했다. 홍보 영상은 그대로 남았고, 녹색채권 발행 일정도 그대로다. 문제는 사라지지 않고 다음 보고서로 넘어갔다."}
  }[S.st.end];
  const routeTxt = [];
  if(S.br.C2) routeTxt.push("데이터 분석으로 기준연도 문제를 증명했다 (2022년 기준 40% → 2019년 기준 13%).");
  else if(S.e4==="raw") routeTxt.push("배출량 분석을 끝내지 못해 기준연도 쟁점은 증명하지 못했다. 범위 문제로 우회했다.");
  else routeTxt.push("배출량 원자료를 분석하지 않았다. 기준연도 쟁점은 청문회에 올라오지 않았다.");
  if(S.br.C1) routeTxt.push("‘태림그룹 전체’와 ‘해온 산업단지’의 범위 차이를 증인이 시인했다.");
  routeTxt.push("검증은 실제로 이뤄졌지만, 그 대상이 산단 Scope 1·2뿐이었음을 확인했다.");
  routeTxt.push("‘100% 재생에너지’는 인증서 구매 69%를 포함한 회계상 수치이며, 실제 전력의 79%가 계통 전력임을 드러냈다.");
  const next = S.br.C2
    ? "기준연도 변경은 녹색채권 발행 직전 본부 회의에서 결정됐다. 그 회의록에는 누구의 이름이 있을까. 그리고 윤하진은 왜 그 요청을 따랐을까."
    : "홍보 영상의 ‘기업 전체’ 문구는 누가 승인했을까. 데이터팀이 만들지 않은 숫자는 어디에서 왔을까.";
  return `<div class="res">
    <div class="card ending ${end.bad?"bad":""}"><span class="k">${end.k}</span><h2>${end.h}</h2><p>${end.p}</p></div>
    <div class="grades">${G.map(([l,v,s])=>`<div class="grade"><span class="lb">${l}</span><span class="g ${letter(v)==="C"?"c":""}">${letter(v)}</span><small>${s}</small></div>`).join("")}</div>
    <div class="card"><h3>청문회 기록 · 입증된 것</h3><ul>${routeTxt.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <div class="card"><h3>입증하지 못한 것</h3><ul>
      <li>누가, 어떤 의도로 홍보 문구와 기준연도를 정했는지는 아직 증거가 없다.</li>
      <li>인증서 구매는 국제 기준이 인정하는 방식이다. 위법이 아니라 표현의 문제다.</li>
      <li>이번 청문회는 폐수 처리 시설 사고의 원인을 다루지 않았다.</li></ul></div>
    <div class="card"><h3>NEXT · CHAPTER 2 사라진 작업 기록</h3><p>${next}</p>${S.flags.water||has("E10")?`<p style="color:var(--warn)">사고 당일 02:00–09:00, 수질 측정값 7시간이 비어 있다. 유지보수 노동자들은 그 시간에 무엇을 봤을까.</p>`:""}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="primary" data-a="restart">처음부터 다시</button></div>
  </div>`;
}

function closeModal(){ document.getElementById('modal').innerHTML=""; }
function bindModal(){
  const m=document.getElementById('modal');
  m.querySelectorAll('[data-a]').forEach(el=>{
    el.addEventListener('click',ev=>{
      const a=el.dataset.a;
      if(a==="mclose"){ if(ev.target===el) closeModal(); return; }
      ev.stopPropagation();
      if(a==="close") closeModal();
      if(a==="evsel"){ evSel=el.dataset.id; drawFile(); }
      if(a==="review"){ if(!S.reviewed.includes(evSel)) S.reviewed.push(evSel); SFX.page(); drawFile(); }
      if(a==="doPresent") present(evSel);
      if(a==="q") askQ(el.dataset.id);
    });
  });
  const f=m.querySelector('.x'); if(f) f.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{ if(e.key==="Escape") closeModal(); });

function bind(){
  document.querySelectorAll('#top [data-a], #scene [data-a]').forEach(el=>{
    const fire=()=>act(el.dataset.a, el.dataset);
    el.addEventListener('click',fire);
    if(el.tagName==="g") el.addEventListener('keydown',e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fire();}});
  });
}

  switch(a){
    case "start": S.scene="invest"; say([
      ["nar","10월 12일 새벽, 해온 산업단지의 폐수 처리 시설이 멈췄다. 처리되지 않은 물이 인근 하천으로 흘러들었다."],
      ["nar","태림그룹은 ‘예외적인 설비 장애’라고 발표했다. 해온시는 ‘환경 목표는 정상 달성 중’이라고 했다. 그리고 국회가 특별청문회를 열기로 했다."],
      ["han","신입 조사관, 반가워. 특별감사팀 한서윤이야. 청문회까지 7일 남았어.","calm"],
      ["han","첫 증인은 태림그룹 지속가능경영본부장 강도윤. 그는 늘 ‘40% 감축, 100% 재생에너지’를 말하지. 청문회 의제는 그 두 주장이 사실인지야.","calm"],
      ["han","기본 자료 세 건은 증거 파일에 넣어 뒀어. 보고서, 검증의견서, 홍보 영상. 하나씩만 보면 다 그럴듯해. 서로 맞대 봐야 틈이 보여.","calm"],
      ["han","하나 더. 증거마다 ‘증명할 수 없는 범위’가 있어. 그걸 확인하는 습관이 청문회에서 너를 지켜 줄 거야.","smile"]
    ]); break;
    case "loc": S.loc=d.id; render(); break;
    case "note": S.note=d.id; render(); break;
    case "take": takeItem(d.ev); break;
    case "tohearing": startHearing(); break;
    case "fbase": S.fz.base=+d.y; render(); break;
    case "fnotes": S.fz.notes=!S.fz.notes; render(); break;
    case "fnote": S.fz.note=+d.y; render(); break;
    case "f1": if(S.fz.base===2022){ S.fz.step=2; S.fz.notes=true; SFX.hit(); say([["han","맞아, 40%는 2022년을 기준으로 해야 나와. 그런데 직전 보고서의 기준연도는 2019년이었지. 왜 하필 2022년일까? 각주를 봐.","calm"]]); } else fMiss(`${S.fz.base}년 기준이면 감축률이 ${red(S.fz.base).toFixed(1)}%야. 보고서의 40%와 맞지 않아.`); break;
    case "f2": if(S.fz.note===2022){ S.fz.step=3; SFX.hit(); say([["han","그거야. 2022년은 2공장 시운전과 노후 보일러가 겹쳐서 배출량이 일시적으로 치솟은 해야. 그 해를 기준으로 삼으면 감축 폭이 크게 보이지.","calm"],["han","마지막으로, 원래 기준이던 2019년으로 다시 계산해 봐.","calm"]]); } else fMiss(`${S.fz.note}년 각주는 2022년 배출량이 높았던 이유를 설명하지 않아.`); break;
    case "f3": { const v=parseFloat(document.getElementById('f3in').value);
      if(v>=12.5&&v<=13.5){ S.e4="analyzed"; S.ev.push("E4a"); S.scene="invest"; SFX.hit(); stamp("분석 완료","good");
        say([["han","13%. 40%와는 전혀 다른 그림이지. 분석 메모를 증거 파일에 넣었어.","smile"],["han","다만 기억해. 기준연도를 다시 정하는 것 자체는 허용돼. 우리가 보여 줄 수 있는 건 ‘이 기준이 감축을 크게 보이게 한다’는 것까지야. 누가 왜 바꿨는지는 아직 몰라.","calm"]]);
      } else fMiss(isNaN(v)?"숫자를 입력해야 해.":`${v}%는 아니야. (2019년 값 − 2025년 값) ÷ 2019년 값으로 계산해 봐.`); } break;
    case "fquit": S.e4="raw"; S.ev.push("E4r"); S.scene="invest"; say([["han","원자료만 챙겼어. 분석 없이 청문회에서 기준연도를 문제 삼기는 어려울 거야.","calm"]]); break;
    case "ph": S.sel=d.id; SFX.page(); render(); break;
    case "present": openFile("present"); break;
    case "ask": openQs(); break;
    case "r4": r4pick(d.id); break;
    case "r5c": r5claim(d.id); break;
    case "r5e": r5ev(d.id); break;
    case "r5x": r5end(d.id); break;
    case "restart": fresh(); render(); break;
  }
}
function takeItem(id){
  const it=LOCS.flatMap(l=>l.items).find(x=>x.ev===id);
  if(S.days<it.cost) return;
  S.days-=it.cost;
  if(it.forensic){ S.fz={base:null,notes:false,note:null,step:1,miss:0}; S.scene="foren"; say([["han","원자료를 받아 왔어. 보고서의 40%가 어디서 나왔는지 직접 재현해 보자.","calm"]]); return; }
  if(it.interview){
    S.interviewed=true; S.ev.push("E9");
    say([["yoon","감사팀이요? …네, 보고서 원자료는 저희 팀이 만들었어요.","evasive"],
      ["me","보고서의 40%는 어떤 범위를 집계한 겁니까?"],
      ["yoon","해온 산단의 Scope 1·2요. 저희가 집계하는 건 거기까지예요. 그룹 전체 40%라는 숫자는… 저희가 만든 적이 없어요.","pressed"],
      ["me","기준연도가 2019년에서 2022년으로 바뀐 이유는요?"],
      ["yoon","본부 요청이었어요. 산단 확장을 반영한다고 했고요. 그 이상은… 저도 몰라요.","evasive"],
      ["han","거짓말을 하는 것 같지는 않아. 다만 그녀가 아는 범위가 거기까지인 거지. 진술은 증거 파일에 기록했어.","calm"]]);
    return;
  }
  S.ev.push(id); SFX.page();
  const msg = {E8:"그룹 전체로는 6%… 40%와는 거리가 멀어.",E11:"해온시는 기업 수치를 그대로 옮겨 적었네. 독자적인 측정은 아니야.",E5:"1년 전엔 기준연도가 2019년이었고, 그땐 배출량이 ‘증가’였어. 그런데 기준이 바뀐 것 자체가 잘못이라고 할 수 있을까?",E6:"재생에너지의 69%가 인증서 구매야. 인증서 구매 자체는 국제 기준이 인정하는 방식이긴 해.",E7:"산단이 실제로 받는 전기의 79%가 일반 전력망이야. ‘재생에너지로 가동’이라는 말과는 다르지.",E10:"사고 당일 아침 7시간 기록이 비어 있어. 이번 청문회 의제는 아니지만… 마음에 걸리네."}[id];
  say([["han",msg,"calm"]]);
}
function startHearing(){
  S.scene="hearing"; S.stage="T1"; S.sel=null; S.kexpr="calm";
  say([["nar","국회 특별청문회장. 카메라 플래시가 터진다."],
    ["chair","지금부터 해온 산업단지 사고 관련 특별청문회를 시작하겠습니다. 증인, 탄소 감축 성과에 대해 진술해 주십시오.","calm"],
    ["kang","태림그룹은 기준 연도 대비 탄소배출량을 40% 줄였습니다. 이 수치는 외부 전문기관의 검증을 거쳤습니다. 따라서 당사는 환경 성과를 정확하게 공개했습니다.","smile"],
    ["han","증언에서 의문을 제기할 구절을 고르고, 맞는 증거를 제시해. 문장이 사실이어도 그 문장이 무엇을 포함하는지는 별개야.","calm"],
    ["han","틀린 증거를 내면 증인이 방어를 굳혀. 그땐 추가 질문으로 흔들면 돼. 한 번 틀렸다고 끝나지 않아.","calm"]]);
}
function r4pick(id){
  const o=R4.find(x=>x.id===id); S.r4tried=S.r4tried||[]; S.r4tried.push(id);
  const items=[["me",o.t]];
  if(o.ok){
    S.st.r4=id; SFX.hit();
    items.push(()=>stamp("논파","good"));
    items.push(o.k);
    items.push(["han",o.why,"calm"]);
    if(id==="D") items.push(["han","녹색채권 일정… 처음 나온 단서야. 다음 챕터에서 이 회의를 파고들어야 해.","calm"]);
    else if(has("E4a")) items.push(["han","기준연도 분석도 있었는데, 그건 결론에서 써먹자.","calm"]);
    items.push(()=>{S.scene="r5";});
    items.push(["chair","조사관, 위원회에 제출할 판단을 정리해 주십시오.","calm"]);
  } else {
    S.st.r4w++; S.cred=Math.max(10,S.cred-15); SFX.bad();
    items.push(()=>stamp("반격","bad"));
    items.push(o.k); items.push(["han",o.why+" 다른 질의로 다시 해 봐.","pressed"]); items.push(lowCred);
  }
  say(items);
}
function r5claim(id){
  const c=R5C.find(x=>x.id===id);
  if(c.ok){ S.r5.claim=id; S.r5.done.claim=true; S.r5.badClaim=null; SFX.page(); render(); }
  else { S.r5.badClaim=id; S.st.r5w++; S.cred=Math.max(10,S.cred-10); SFX.bad(); say([["han",c.why,"calm"]]); }
}
function r5ev(id){
  if(R5OK[id]){ S.r5.ev=id; S.r5.done.ev=true; S.r5.badEv=null; SFX.page();
    if(R5OK[id]==="best") say([["han","정부 명세서는 그룹 전체를 직접 보여 주는 자료야. 가장 강한 근거지.","smile"]]); else render(); }
  else { S.r5.badEv=id; S.st.r5w++; S.cred=Math.max(10,S.cred-10); SFX.bad();
    const why = id==="E3"?"홍보 자막은 반박할 주장 그 자체야. 근거가 될 수 없어.": id==="E4a"?"기준연도 분석은 강력하지만, 지금 반박하는 건 ‘그룹 전체’라는 범위 문제야. 범위를 보여 주는 증거가 필요해.": id==="E4r"?"원자료만으로는 그룹 전체에 대해 말할 수 없어.":"이 증거는 ‘그룹 전체 40%’라는 주장과 직접 연결되지 않아.";
    say([["han",why,"calm"]]); }
}
function r5end(id){
  const e=R5E.find(x=>x.id===id); S.st.concl=id; S.st.end=e.end;
  const items=[["me",`위원회에 보고합니다. ${e.t}`]];
  if(id==="w"||id==="x"){ SFX.hit(); items.push(()=>stamp("판단 채택","good")); items.push(["chair","증거가 말하는 범위 안에서 정리된 판단입니다. 위원회 기록에 남기겠습니다.","calm"]); items.push(["kang","…홍보 문구는 정정하겠습니다.","pressed"]); }
  if(id==="y"){ SFX.bad(); items.push(()=>stamp("과잉 결론","bad")); items.push(["kang","산단의 감축은 검증된 사실입니다. 조사관의 결론은 증거를 넘어섰습니다.","angry"]); items.push(["chair","…증인의 이의를 기록하겠습니다.","calm"]); items.push(["han","과장을 밝히려다 우리가 과장을 했어. 증거가 말하지 않는 것까지 말해 버린 거야.","pressed"]); }
  if(id==="z"){ SFX.soft(); items.push(()=>stamp("면죄부","soft")); items.push(["kang","감사합니다. 저희는 앞으로도 투명하게 공개하겠습니다.","smile"]); items.push(["han","검증받은 건 산단 수치였어. 홍보는 검증받은 적이 없고.","pressed"]); }
  items.push(()=>{S.scene="result";});
  say(items);
}

render();
</script>
